# Pannello ordini (Worker separato da quello pubblico delle iscrizioni).
# Si pubblica con:  npm run deploy:admin
# L'intero indirizzo admin-corsi.<account>.workers.dev va protetto con
# Cloudflare Access; il codice verifica comunque il token di Access e,
# finché ACCESS_TEAM_DOMAIN e ACCESS_AUD sono vuoti, resta tutto chiuso.
name = "admin-corsi"
main = "src/admin.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "iscrizioni-corsi"
database_id = "c36aa84d-e0a4-496e-aae3-f63ac225b356"

[vars]
# Email che possono entrare nel pannello (le stesse da autorizzare in Access)
ADMIN_EMAILS = "corsi@mariobruzzese.it,mario.bruz@gmail.com"
# Da compilare dopo aver attivato Cloudflare Access (vedi istruzioni)
ACCESS_TEAM_DOMAIN = "restless-rice-1e6d.cloudflareaccess.com"
ACCESS_AUD = "bdcc249f2bd6479d2ba673d21fad8866d7ced617a29169ef4e2ef5d08ebafa04"
# Per l'email di conferma quando segni un bonifico come ricevuto
EMAIL_MITTENTE = "corsi@mariobruzzese.it"
NOME_MITTENTE = "MB Consulting"
EMAIL_AMMINISTRATORE = "corsi@mariobruzzese.it"

# Segreto (lo stesso del Worker pubblico):
#   npx wrangler secret put BREVO_API_KEY -c admin.toml
#
# Statistiche di visita nel pannello (scheda "Visite e conversioni"):
# token Cloudflare con il solo permesso Account → Account Analytics → Read
#   npx wrangler secret put CF_API_TOKEN -c admin.toml
