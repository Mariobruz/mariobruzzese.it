name: Deploy su GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1) costruisce il sito e carica il pacchetto
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Installa dipendenze
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Build del sito
        run: yarn build
        working-directory: frontend

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v4

      - name: Carica i file su Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/build

  # 2) pubblica in un job separato: il pacchetto è già registrato quando parte
  #    (con build e pubblicazione nello stesso job GitHub a volte non lo trova)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Scarica il codice (per IndexNow)
        uses: actions/checkout@v4

      - name: Avvisa Bing con IndexNow
        if: success()
        continue-on-error: true
        # la sitemap la prende dal sito appena pubblicato (in questo job non c'è la cartella build)
        run: |
          sleep 60
          mkdir -p build
          curl -fsSL https://www.mariobruzzese.it/sitemap.xml -o build/sitemap.xml
          node scripts/indexnow.js
        working-directory: frontend
