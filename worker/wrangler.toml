name = "iscrizioni-corsi"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Dominio su cui risponde il Worker. Il sito lo chiama a questo indirizzo.
# routes = [{ pattern = "iscrizioni.mariobruzzese.it", custom_domain = true }]

# Ogni lunedi alle 8 (UTC): tiene attiva la chiave API di Brevo
[triggers]
crons = ["0 8 * * 1"]

# Freno ai bot: massimo 5 iscrizioni al minuto dallo stesso indirizzo IP
[[unsafe.bindings]]
name = "LIMITE_ISCRIZIONI"
type = "ratelimit"
namespace_id = "2403"
simple = { limit = 5, period = 60 }

[[d1_databases]]
binding = "DB"
database_name = "iscrizioni-corsi"
database_id = "c36aa84d-e0a4-496e-aae3-f63ac225b356"

[vars]
# Valori non segreti: si possono tenere qui.
SITO_URL = "https://www.mariobruzzese.it"
ORIGINI_AMMESSE = "https://www.mariobruzzese.it,https://mariobruzzese.it"
EMAIL_MITTENTE = "corsi@mariobruzzese.it"
NOME_MITTENTE = "MB Consulting"
EMAIL_AMMINISTRATORE = "corsi@mariobruzzese.it"
INTESTATARIO_CONTO = "MB Consulting di Mario Bruzzese"

# I segreti NON vanno qui. Si impostano con:
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put BREVO_API_KEY
#   wrangler secret put IBAN
#   wrangler secret put TURNSTILE_SECRET   (anti-bot, facoltativo)
